<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theo dõi khám sức khoẻ tại khu phố - Phường Linh Xuân</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Roboto+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --green-dark:#0f5132;
    --green:#1a7a41;
    --green-light:#e8f4ec;
    --red:#c62828;
    --red-dark:#8e1c1c;
    --cream:#f7f6f1;
    --paper:#ffffff;
    --ink:#1c2a22;
    --ink-soft:#5b6b60;
    --line:#dce3dd;
    --gold:#c9971f;
    --silver:#8a97a3;
    --bronze:#a9673a;
    --shadow: 0 2px 10px rgba(15,81,50,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  #app{flex:1; display:flex; flex-direction:column; min-height:100vh;}

  /* ---------- MASTHEAD ---------- */
  .masthead{
    background: linear-gradient(135deg, var(--green-dark), var(--green) 65%);
    color:#fff;
    padding:14px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    border-bottom:4px solid var(--red);
    box-shadow:var(--shadow);
  }
  .masthead-left{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
  }
  .masthead-left img{
    height:56px;
    width:56px;
    border-radius:50%;
    background:#fff;
    padding:3px;
    flex-shrink:0;
    box-shadow:0 0 0 2px rgba(255,255,255,0.35);
  }
  .masthead-title h1{
    margin:0;
    font-family:'Roboto Condensed', sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.3px;
    line-height:1.25;
    text-transform:uppercase;
  }
  .masthead-title p{
    margin:2px 0 0;
    font-size:12.5px;
    color:#d9ecdf;
    font-weight:500;
    letter-spacing:0.4px;
  }
  .masthead-right{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .role-chip{
    background:rgba(255,255,255,0.16);
    border:1px solid rgba(255,255,255,0.3);
    padding:6px 12px;
    border-radius:20px;
    font-size:12.5px;
    font-weight:600;
    white-space:nowrap;
  }
  .btn-logout{
    background:var(--red);
    color:#fff;
    border:none;
    padding:8px 16px;
    border-radius:8px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s;
  }
  .btn-logout:hover{background:var(--red-dark);}

  /* ---------- TABS ---------- */
  .tabbar{
    display:flex;
    gap:6px;
    background:var(--paper);
    padding:8px 18px 0;
    border-bottom:1px solid var(--line);
    overflow-x:auto;
  }
  .tabbtn{
    border:none;
    background:#eef2ef;
    padding:12px 20px;
    font-size:14px;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
    border:1.5px solid transparent;
    border-bottom:none;
    border-radius:10px 10px 0 0;
    white-space:nowrap;
    transition:background .15s, color .15s;
  }
  .tabbtn:hover{background:#e2e9e4; color:var(--green-dark);}
  .tabbtn.active{
    background:var(--paper);
    color:var(--green-dark);
    border-color:var(--line);
    border-bottom:3px solid var(--red);
    box-shadow:0 -2px 8px rgba(15,81,50,0.08);
  }

  .content{
    flex:1;
    padding:22px;
    max-width:1180px;
    width:100%;
    margin:0 auto;
  }

  /* ---------- LOGIN ---------- */
  .login-wrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-card{
    background:var(--paper);
    border-radius:16px;
    box-shadow:0 10px 30px rgba(15,81,50,0.14);
    padding:36px 32px;
    width:100%;
    max-width:390px;
    text-align:center;
  }
  .login-card img{height:76px; width:76px; border-radius:50%; box-shadow:0 0 0 3px var(--green-light);}
  .login-card h2{
    font-family:'Roboto Condensed',sans-serif;
    font-size:17px;
    text-transform:uppercase;
    color:var(--green-dark);
    margin:14px 0 2px;
  }
  .login-card p.sub{color:var(--ink-soft); font-size:13px; margin:0 0 22px;}
  .login-card input[type=password], .login-card input[type=text]{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:10px;
    font-size:15px;
    text-align:center;
    letter-spacing:1px;
    outline:none;
  }
  .login-card input:focus{border-color:var(--green);}
  .login-card .btn-primary{margin-top:14px; width:100%;}
  .login-error{color:var(--red); font-size:13px; margin-top:10px; font-weight:600; min-height:18px;}
  .login-hint{color:var(--ink-soft); font-size:12px; margin:8px 0 0; line-height:1.4;}

  /* ---------- BUTTONS / FORM ---------- */
  .btn-primary{
    background:var(--green-dark);
    color:#fff;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    transition:background .15s;
  }
  .btn-primary:hover{background:var(--green);}
  .btn-secondary{
    background:#fff;
    color:var(--green-dark);
    border:1.5px solid var(--green-dark);
    padding:9px 16px;
    border-radius:8px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .btn-secondary:hover{background:var(--green-light);}

  .card{
    background:var(--paper);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:22px;
    margin-bottom:20px;
  }
  .card h3{
    margin:0 0 16px;
    font-family:'Roboto Condensed',sans-serif;
    font-size:16px;
    text-transform:uppercase;
    color:var(--green-dark);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .field-row{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:6px;}
  .field{flex:1; min-width:150px; margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:.3px;}
  .field input{
    width:100%;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:15px;
    font-family:inherit;
  }
  .field input:focus{outline:none; border-color:var(--green);}
  .field input.invalid{border-color:var(--red); background:#fdf1f1;}
  .field .err{color:var(--red); font-size:12px; font-weight:600; margin-top:4px; min-height:16px;}
  select.khu-select{
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:14.5px;
    font-weight:600;
    font-family:inherit;
    background:#fff;
    color:var(--green-dark);
  }

  .banner{
    padding:11px 16px;
    border-radius:9px;
    font-size:13.5px;
    font-weight:600;
    margin-bottom:16px;
  }
  .banner.ok{background:#e6f4ea; color:var(--green-dark); border:1px solid #b8dfc4;}
  .banner.warn{background:#fdf1e0; color:#8a5a12; border:1px solid #f0d29a;}
  .banner.err{background:#fdecec; color:var(--red-dark); border:1px solid #f3bcbc;}

  /* ---------- TABLES ---------- */
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th,td{padding:10px 12px; border-bottom:1px solid var(--line); text-align:right;}
  th{
    background:var(--green-light);
    color:var(--green-dark);
    font-weight:700;
    text-transform:uppercase;
    font-size:11.5px;
    letter-spacing:.3px;
    position:sticky; top:0;
  }
  td.name-cell, th.name-cell{text-align:center; font-weight:600;}
  tbody tr:hover{background:#fbfbf8;}
  tr.total-row td{
    font-weight:800;
    background:var(--green-light);
    color:var(--green-dark);
    border-top:2px solid var(--green);
  }
  .table-scroll{overflow-x:auto;}
  .rank-badge{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px;height:26px;border-radius:50%;font-weight:800;font-size:12px;color:#fff;
    margin-right:4px;
  }
  .rank-1{background:var(--gold);}
  .rank-2{background:var(--silver);}
  .rank-3{background:var(--bronze);}
  .rank-plain{color:var(--ink-soft); font-weight:700;}
  .dat-cell{display:flex; align-items:center; justify-content:flex-end; gap:8px;}
  .dat-bar-wrap{width:72px; height:9px; background:var(--line); border-radius:5px; overflow:hidden; flex-shrink:0;}
  .dat-bar-fill{height:100%; background:linear-gradient(90deg, var(--green), var(--green-dark)); border-radius:5px;}
  .dat-bar-label{font-weight:700; min-width:52px; text-align:right; color:var(--ink);}
  tr.total-row .dat-bar-label{color:var(--green-dark);}
  .action-cell{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
  }
  .edit-link{
    color:var(--green-dark); font-weight:700; cursor:pointer; font-size:12.5px; text-decoration:underline;
    background:none; border:none; padding:0;
  }
  .edit-link.edit-link-danger{ color:var(--red); }
  .muted{color:var(--ink-soft); font-size:12.5px;}
  .spinner-wrap{display:flex; align-items:center; gap:10px; color:var(--ink-soft); font-size:13.5px; padding:30px 0; justify-content:center;}
  .spinner{
    width:18px;height:18px;border:3px solid var(--line); border-top-color:var(--green); border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .pw-table td{text-align:left;}
  .pw-table input{padding:8px 10px; border:1.5px solid var(--line); border-radius:7px; font-size:13.5px; width:150px;}
  .pw-row-msg{font-size:12px; font-weight:600; color:var(--green-dark); margin-top:4px;}

  .bulk-toggle-btn{
    background:#fff; color:var(--red-dark); border:1.5px dashed var(--red);
    padding:10px 16px; border-radius:9px; font-weight:700; font-size:13.5px; cursor:pointer; margin-bottom:10px;
  }
  .bulk-toggle-btn:hover{background:#fdf1f1;}
  .file-upload-row{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    background:var(--green-light); border:1px dashed var(--green); border-radius:10px;
    padding:12px 14px; margin-bottom:16px;
  }
  .file-upload-row label.file-btn{
    background:var(--green-dark); color:#fff; padding:8px 14px; border-radius:7px;
    font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .file-upload-row label.file-btn:hover{background:var(--green);}
  .file-upload-row input[type=file]{display:none;}
  .bulk-table input{
    width:90px; padding:7px 8px; border:1.5px solid var(--line); border-radius:6px; font-size:13.5px; text-align:right;
  }
  .bulk-table input:disabled{background:#f1f1ee; color:var(--ink-soft);}
  .bulk-table td.khu-name{text-align:center; font-weight:600;}
  .bulk-expired{font-size:11.5px; color:var(--red); font-weight:600;}

  footer{
    text-align:center;
    padding:16px;
    font-size:12.5px;
    color:var(--ink-soft);
    background:var(--paper);
    border-top:1px solid var(--line);
  }
  footer b{color:var(--green-dark);}

  @media (max-width:640px){
    .masthead-title h1{font-size:15px;}
    .content{padding:14px;}
    .card{padding:16px;}
  }
</style>
</head>

function isPasswordTaken(pw, exclude){
  exclude = exclude || {};
  if(pw === ADMIN_PW) return true;
  const pwMap = state.passwordsMap || {};
  for(const id of KHU_IDS){
    if(exclude.khuId !== undefined && String(exclude.khuId) === String(id)) continue;
    if(pwMap[id] === pw) return true;
  }
  const accMap = state.accountsConfig || {};
  for(const key of Object.keys(accMap)){
    if(exclude.accountKey !== undefined && exclude.accountKey === key) continue;
    if(key === pw) return true;
  }
  return false;
}
function isFullControl(){
  return state.role === 'admin' || (state.role && state.role.type === 'custom');
}

/* ================= STORAGE HELPERS ================= */
async function storageGet(key, shared){
  try{
    const resp = await fetch(`${GAS_URL}?action=get&key=${encodeURIComponent(key)}`);
    if(!resp.ok) return null;
    const data = await resp.json();
    return (data && data.value !== undefined && data.value !== null) ? data.value : null;
  }catch(e){
    console.error("storageGet failed", e);
    return null;
  }
}
async function storageSet(key, value, shared){
  try{
    const resp = await fetch(GAS_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"}, // tránh CORS preflight với Apps Script
      body: JSON.stringify({action:"set", key, value})
    });
    if(!resp.ok) return false;
    const data = await resp.json();
    return !!(data && data.ok);
  }catch(e){
    console.error("storage set failed", e);
    return false;
  }
}

async function loadPasswordsMap(){
  if(state.passwordsMap) return state.passwordsMap;
  let raw = await storageGet(STORE_PREFIX+"passwords", true);

  if(raw){

  }
  if(!map){
    map = {};
    KHU_IDS.forEach(id=> map[id] = "kp"+id);
    await storageSet(STORE_PREFIX+"passwords", JSON.stringify(map), true);
  }
  state.passwordsMap = map;
  return map;
}

/* ================= UTIL ================= */
function fmt(n){ return Number(n||0).toLocaleString('vi-VN'); }
function pct(n){ return (Number(n||0)).toLocaleString('vi-VN', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function toDateStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayClamped(){
  const min = new Date(DATE_MIN+"T00:00:00");
  const max = new Date(DATE_MAX+"T00:00:00");
  const now = new Date();
  let d = now < min ? min : (now > max ? max : now);
  return toDateStr(d);
}
function computeTotals(records){
  let phat=0, thu=0, kham=0;
  Object.values(records||{}).forEach(r=>{
    phat += Number(r.phat)||0;
    thu += Number(r.thu)||0;
    kham += Number(r.kham)||0;
  });
  return {phat, thu, kham};
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDateDisplay(iso){
  if(!iso) return "";
  const [y,m,d] = iso.split("-");
  if(!y||!m||!d) return iso;
  return `${d}/${m}/${y}`;
}
function isWithinEditWindow(enteredAt){
  if(!enteredAt) return false;
  return (Date.now() - enteredAt) <= EDIT_WINDOW_MS;
}

async function attemptLogin(pw){
  if(!pw){ state.loginError = "Vui lòng nhập mật mã."; render(); return; }
  state.loginBusy = true; state.loginError=""; render();
  if(pw === ADMIN_PW){
    state.role = 'admin';
    state.tab = 'report';
  } else {
    const accounts = await loadAccountsConfig();
    if(accounts[pw]){
      const acc = accounts[pw];
      state.role = {type:'custom', password: pw, label: acc.label, tabs: acc.tabs};
      state.tab = acc.tabs.report ? 'report' : (acc.tabs.entry ? 'entry' : (acc.tabs.schedule ? 'schedule' : null));
      if(!state.tab){
        state.loginBusy = false;
        state.loginError = "Tài khoản này chưa được cấp quyền xem tab nào. Vui lòng liên hệ Quản trị viên.";
        state.role = null;
        render();
        return;
      }
    } else {
      const map = await loadPasswordsMap();
      let matchedId = null;
      for(const id of KHU_IDS){
        if(map[id] === pw){ matchedId = id; break; }
      }
      if(matchedId){
        const kpTabs = await loadKpTabsConfig();
        state.role = {type:'kp', id: matchedId, tabs: kpTabs[matchedId] || {report:false, entry:true, schedule:true}};
        state.tab = state.role.tabs.entry ? 'entry' : (state.role.tabs.report ? 'report' : 'schedule');
        state.entryKhuId = matchedId;
      } else {
        state.loginBusy = false;
        state.loginError = "Mật mã không đúng. Vui lòng kiểm tra lại.";
        render();
        return;
      }
    }
  }
  state.loginBusy = false;
  await loadScheduleLockState();
  if(state.tab === 'entry'){
    state.entryKhuId = state.entryKhuId || KHU_IDS[0];
    resetForm();
  }
  render();
  if(state.tab === 'entry') afterEntryTabShown();
  if(state.tab === 'report') loadReport();
  resetInactivityTimer();
}

  state = {

    reportData:null, reportLoading:false,

function resetForm(){
  state.formValues = {date: todayClamped(), phat:"", thu:"", kham:""};
  state.formErrors = {};
  state.saveMessage = null;
}

function currentEntryKhuId(){
  if(state.role && state.role.type==='kp') return state.role.id;
  return state.entryKhuId || KHU_IDS[0];
}

let entryDataCache = {}; // id -> {records}

/* ---- Bulk entry (admin: nhập hàng loạt cho 18 khu phố) ---- */
function pickField(row, includesList){
  const keys = Object.keys(row);
  for(const k of keys){
    const nk = String(k).trim().toLowerCase();
    if(includesList.some(inc=> nk.includes(inc))) return row[k];
  }
  return undefined;
}

async function loadBulkDataForDate(date){
  state.bulkLoading = true;
  render();
  const results = await Promise.all(KHU_IDS.map(async id=>{
    const data = entryDataCache[id] || await loadKhuData(id);
    entryDataCache[id] = data;
    const rec = data.records[date];
    return {id, rec};
  }));
  const values = {}; const meta = {};
  results.forEach(({id, rec})=>{
    if(rec){
      values[id] = {phat:String(rec.phat), thu:String(rec.thu), kham:String(rec.kham)};
      meta[id] = {editable: state.role === 'admin' || isWithinEditWindow(rec.enteredAt), enteredAt: rec.enteredAt};
    } else {
      values[id] = {phat:"", thu:"", kham:""};
      meta[id] = {editable:true, enteredAt:null};
    }
  });
  state.bulkValues = values;
  state.bulkMeta = meta;
  state.bulkLoading = false;
  render();
}

async function afterBulkTabShown(){
  state.bulkMessage = null;
  if(!state.bulkDate) state.bulkDate = todayClamped();
  try{
    await loadBulkDataForDate(state.bulkDate);
    state.bulkLoaded = true;
  }catch(e){
    console.error('afterBulkTabShown failed:', e);
    state.bulkLoading = false;
    state.bulkMessage = {type:'err', text:'Không tải được dữ liệu do sự cố lưu trữ. Vui lòng thử lại.'};
    render();
  }
}

async function handleBulkFileUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  state.bulkFileName = file.name;
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {defval:""});
    let matched = 0, skipped = 0;
    rows.forEach((row, idx)=>{
      const rawId = pickField(row, ['khu phố','khu pho','stt','số thứ tự','so thu tu']);
      let khuId = parseInt(String(rawId).replace(/[^0-9]/g,''), 10);
      if(!khuId || khuId < 1 || khuId > KHU_IDS.length) khuId = idx+1;
      if(!POPULATION[khuId]) return;
      const meta = state.bulkMeta[khuId];
      if(meta && meta.editable === false){ skipped++; return; }

      const phat = pickField(row, ['phát phiếu','phat phieu']);
      const thu = pickField(row, ['thu về','thu ve']);
      const kham = pickField(row, ['khám','kham']);

      if(!state.bulkValues[khuId]) state.bulkValues[khuId] = {phat:"",thu:"",kham:""};
      if(phat !== undefined && phat !== "") state.bulkValues[khuId].phat = String(phat);
      if(thu !== undefined && thu !== "") state.bulkValues[khuId].thu = String(thu);
      if(kham !== undefined && kham !== "") state.bulkValues[khuId].kham = String(kham);
      matched++;
    });
    state.bulkMessage = {type:'ok', text: `Đã đọc file và điền dữ liệu cho ${matched} khu phố${skipped? ', bỏ qua '+skipped+' khu phố đã quá 48h':''}. Vui lòng kiểm tra lại rồi bấm "Lưu tất cả".`};
  }catch(err){
    console.error(err);
    state.bulkMessage = {type:'err', text:'Không đọc được file Excel. Vui lòng kiểm tra lại định dạng file (.xlsx).'};
  }
  render();
}

async function handleSaveBulk(){
  const date = state.bulkDate;
  if(!date){ state.bulkMessage = {type:'err', text:'Vui lòng chọn ngày áp dụng.'}; render(); return; }
  let savedCount = 0, skippedExpired = 0, skippedEmpty = 0;
  for(const id of KHU_IDS){
    const meta = state.bulkMeta[id];
    if(meta && meta.editable === false){ skippedExpired++; continue; }
    const v = state.bulkValues[id] || {};
    const hasAny = v.phat !== "" || v.thu !== "" || v.kham !== "";
    if(!hasAny){ skippedEmpty++; continue; }
    if(v.phat === "" || v.thu === "" || v.kham === ""){ skippedEmpty++; continue; }
    const data = entryDataCache[id] || await loadKhuData(id);
    entryDataCache[id] = data;
    const existing = data.records[date];
    const enteredAt = existing ? existing.enteredAt : Date.now();
    data.records[date] = {phat:Number(v.phat)||0, thu:Number(v.thu)||0, kham:Number(v.kham)||0, enteredAt};
    await saveKhuData(id, data);
    savedCount++;
  }
  let msg = `Đã lưu dữ liệu ngày ${formatDateDisplay(date)} cho ${savedCount} khu phố.`;
  if(skippedEmpty) msg += ` Bỏ qua ${skippedEmpty} khu phố do thiếu dữ liệu.`;
  if(skippedExpired) msg += ` Bỏ qua ${skippedExpired} khu phố do đã quá 48h.`;
  state.bulkMessage = {type: savedCount>0 ? 'ok':'warn', text: msg};
  await loadBulkDataForDate(date);
}

/* ---- Xuất file Excel tổng (sao lưu toàn bộ dữ liệu) ---- */
async function handleExportExcel(){
  state.exportBusy = true;
  state.exportMessage = null;
  render();
  try{
    const results = await Promise.all(KHU_IDS.map(async id=>{
      const data = entryDataCache[id] || await loadKhuData(id);
      entryDataCache[id] = data;
      return {id, data};
    }));

    // Sheet 1: Tổng hợp (giống báo cáo tổng)
    const summaryRows = [["STT","Khu phố (Tổ)","Dân số","Phát phiếu","Thu về","Khám","Đạt (%)"]];
    let totalPop=0, totalPhat=0, totalThu=0, totalKham=0;
    const summaryCalc = results.map(({id, data})=>{
      const t = computeTotals(data.records);
      const pop = POPULATION[id];
      const dat = pop ? (t.kham/pop*100) : 0;
      totalPop+=pop; totalPhat+=t.phat; totalThu+=t.thu; totalKham+=t.kham;
      return {id, pop, ...t, dat};
    });
    summaryCalc.forEach(r=>{
      summaryRows.push([r.id, "Khu phố "+r.id, r.pop, r.phat, r.thu, r.kham, Number(r.dat.toFixed(2))]);
    });
    const totalDat = totalPop ? (totalKham/totalPop*100) : 0;
    summaryRows.push(["","TỔNG CỘNG", totalPop, totalPhat, totalThu, totalKham, Number(totalDat.toFixed(2))]);

    // Sheet 2: Chi tiết theo ngày (đầy đủ nhất, phục vụ sao lưu)
    const detailRows = [["Khu phố (Tổ)","Ngày","Phát phiếu","Thu về","Khám","Đạt (%)"]];
    results.forEach(({id, data})=>{
      const pop = POPULATION[id];
      const dates = Object.keys(data.records).sort();
      dates.forEach(date=>{
        const r = data.records[date];
        const rDat = pop ? ((Number(r.kham)||0)/pop*100) : 0;
        detailRows.push(["Khu phố "+id, formatDateDisplay(date), r.phat, r.thu, r.kham, Number(rDat.toFixed(2))]);
      });
    });
    if(detailRows.length === 1) detailRows.push(["(Chưa có dữ liệu nào được nhập)","","","","",""]);

    const wb = XLSX.utils.book_new();
    const ws1 = XLSX.utils.aoa_to_sheet(summaryRows);
    ws1['!cols'] = [{wch:6},{wch:16},{wch:12},{wch:14},{wch:12},{wch:12},{wch:12}];
    XLSX.utils.book_append_sheet(wb, ws1, "Tổng hợp");

    const ws2 = XLSX.utils.aoa_to_sheet(detailRows);
    ws2['!cols'] = [{wch:16},{wch:14},{wch:14},{wch:12},{wch:12},{wch:12}];
    XLSX.utils.book_append_sheet(wb, ws2, "Chi tiết theo ngày");

    const now = new Date();
    const stamp = now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+"-"+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0');
    XLSX.writeFile(wb, `sao-luu-kham-suc-khoe-linh-xuan-${stamp}.xlsx`);

    state.exportMessage = {type:'ok', text:'Đã xuất file Excel tổng thành công. Kiểm tra thư mục Tải xuống (Downloads) của trình duyệt.'};
  }catch(err){
    console.error('Export failed:', err);
    state.exportMessage = {type:'err', text:'Xuất file thất bại do sự cố lưu trữ. Vui lòng thử lại.'};
  }
  state.exportBusy = false;
  render();
}

async function handleSaveEntry(){
  const fv = state.formValues;
  const errors = {};
  if(fv.phat === "" || fv.phat === null || fv.phat === undefined) errors.phat = "Chưa nhập";
  if(fv.thu === "" || fv.thu === null || fv.thu === undefined) errors.thu = "Chưa nhập";
  if(fv.kham === "" || fv.kham === null || fv.kham === undefined) errors.kham = "Chưa nhập";
  if(!fv.date) errors.date = "Chưa chọn ngày";

  if(Object.keys(errors).length){
    state.formErrors = errors;
    render();
    return;
  }
  state.formErrors = {};

  const id = currentEntryKhuId();
  const data = entryDataCache[id] || await loadKhuData(id);
  entryDataCache[id] = data;
  const existing = data.records[fv.date];
  const isOverwrite = !!existing;

  if(isOverwrite && state.role !== 'admin' && !isWithinEditWindow(existing.enteredAt)){
    state.saveMessage = {type:'err', text:'Đã quá 48 giờ kể từ lúc nhập, không thể sửa dữ liệu ngày này.'};
    render();
    return;
  }

  const enteredAt = isOverwrite ? existing.enteredAt : Date.now();
  data.records[fv.date] = {phat:Number(fv.phat)||0, thu:Number(fv.thu)||0, kham:Number(fv.kham)||0, enteredAt};
  await saveKhuData(id, data);

  state.saveMessage = isOverwrite
    ? {type:'warn', text:'Đã ghi đè ngày đã nhập trước đó.'}
    : {type:'ok', text:'Đã lưu thành công.'};
  render();
}

function renderReportTab(){
  if(state.reportLoading || !state.reportData){
    return `<div class="card"><div class="spinner-wrap"><div class="spinner"></div> Đang tải báo cáo tổng (song song ${KHU_IDS.length} khu phố)...</div></div>`;
  }
  const rows = state.reportData;
  let totalPop=0, totalPhat=0, totalThu=0, totalKham=0;
  rows.forEach(r=>{ totalPop+=r.pop; totalPhat+=r.phat; totalThu+=r.thu; totalKham+=r.kham; });
  const totalDat = totalPop ? (totalKham/totalPop*100) : 0;

  function rankBadge(rank){
    if(rank===1) return `<span class="rank-badge rank-1">1</span>`;
    if(rank===2) return `<span class="rank-badge rank-2">2</span>`;
    if(rank===3) return `<span class="rank-badge rank-3">3</span>`;
    return `<span class="rank-plain">${rank}</span>`;
  }

  function datBar(value){
    const w = Math.max(0, Math.min(100, value));
    return `<div class="dat-cell">
      <div class="dat-bar-wrap"><div class="dat-bar-fill" style="width:${w.toFixed(1)}%"></div></div>
      <span class="dat-bar-label">${pct(value)}%</span>
    </div>`;
  }

  const bodyRows = rows.map(r=>`
    <tr>
      <td class="name-cell">Khu phố ${r.id}</td>
      <td>${fmt(r.pop)}</td>
      <td>${fmt(r.phat)}</td>
      <td>${fmt(r.thu)}</td>
      <td>${fmt(r.kham)}</td>
      <td>${datBar(r.dat)}</td>
      <td style="text-align:center;">${rankBadge(r.rank)}</td>
    </tr>`).join('');

  return `
    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
        <h3 style="margin:0;">📈 Báo cáo tổng — Toàn phường</h3>
        <button class="btn-secondary" id="refreshReportBtn">🔄 Làm mới</button>
      </div>
      <p class="muted" style="margin-bottom:14px;">Đạt (%) = Khám / Dân số khu phố × 100 — tức tỷ lệ số người đã được khám trên tổng dân số của khu phố đó.</p>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th class="name-cell">Khu phố (Tổ)</th>
              <th>Dân số</th>
              <th>Phát phiếu</th>
              <th>Thu về</th>
              <th>Khám</th>
              <th title="Đạt = Khám / Dân số × 100">Đạt (%)</th>
              <th>Thứ hạng</th>
            </tr>
          </thead>
          <tbody>
            ${bodyRows}
            <tr class="total-row">
              <td class="name-cell">TỔNG CỘNG</td>
              <td>${fmt(totalPop)}</td>
              <td>${fmt(totalPhat)}</td>
              <td>${fmt(totalThu)}</td>
              <td>${fmt(totalKham)}</td>
              <td>${datBar(totalDat)}</td>
              <td>—</td>
            </tr>
          </tbody>
        </table>
      </div>
      <p class="muted" style="margin-top:14px;">🥇 Hạng 1 &nbsp; 🥈 Hạng 2 &nbsp; 🥉 Hạng 3 — xếp theo tỷ lệ Đạt (Khám / Dân số) cao nhất.</p>
    </div>
  `;
}

async function loadReport(){
  state.reportLoading = true;
  state.reportData = null;
  render();
  const results = await Promise.all(KHU_IDS.map(async id=>{
    const data = await loadKhuData(id);
    const totals = computeTotals(data.records);
    const pop = POPULATION[id];
    const dat = pop ? (totals.kham/pop*100) : 0;
    return {id, pop, phat:totals.phat, thu:totals.thu, kham:totals.kham, dat};
  }));
  // rank by dat descending (competition ranking)
  const sorted = [...results].sort((a,b)=> b.dat - a.dat);
  let rankMap = {};
  sorted.forEach((r,idx)=>{
    if(idx>0 && sorted[idx-1].dat === r.dat){
      rankMap[r.id] = rankMap[sorted[idx-1].id];
    } else {
      rankMap[r.id] = idx+1;
    }
  });
  results.forEach(r=> r.rank = rankMap[r.id]);
  state.reportData = results.sort((a,b)=> a.rank - b.rank || a.id - b.id);
  state.reportLoading = false;
  render();
}

function bindReportTab(){
  const btn = document.getElementById('refreshReportBtn');
  if(btn) btn.addEventListener('click', loadReport);
}

async function handleSaveAccount(){
  const fv = state.accountForm;
  const newPw = (fv.password||"").trim();
  const label = (fv.label||"").trim();
  if(!newPw || !label){
    state.accountMgmtMessage = {type:'err', text:'Vui lòng nhập đầy đủ Tên hiển thị và Mật mã.'};
    render();
    return;
  }
  if(!fv.tabs.report && !fv.tabs.entry && !fv.tabs.schedule){
    state.accountMgmtMessage = {type:'err', text:'Vui lòng chọn ít nhất 1 tab được xem.'};
    render();
    return;
  }
  await loadPasswordsMap();
  await loadAccountsConfig();

  if(state.accountEditKey && state.accountEditKey.startsWith('kp:')){
    const id = Number(state.accountEditKey.slice(3));
    if(isPasswordTaken(newPw, {khuId: id})){
      state.accountMgmtMessage = {type:'err', text:'Mật mã này đã được dùng cho tài khoản khác. Vui lòng chọn mật mã khác.'};
      render();
      return;
    }
    const pwMap = await loadPasswordsMap();
    pwMap[id] = newPw;
    await storageSet(STORE_PREFIX+"passwords", JSON.stringify(pwMap), true);
    state.passwordsMap = pwMap;
    const kpTabsMap = await loadKpTabsConfig();
    kpTabsMap[id] = {report:!!fv.tabs.report, entry:!!fv.tabs.entry, schedule:!!fv.tabs.schedule};
    await saveKpTabsConfig(kpTabsMap);
    state.accountFormOpen = false;
    state.accountEditKey = null;
    state.accountMgmtMessage = {type:'ok', text: `Đã cập nhật Khu phố ${id}.`};
    render();
    return;
  }

  const accounts = await loadAccountsConfig();
  const excludeKey = state.accountEditKey || undefined;
  if(isPasswordTaken(newPw, {accountKey: excludeKey})){
    state.accountMgmtMessage = {type:'err', text:'Mật mã này đã được dùng cho tài khoản khác. Vui lòng chọn mật mã khác.'};
    render();
    return;
  }
  if(state.accountEditKey && state.accountEditKey !== newPw){
    delete accounts[state.accountEditKey];
  }
  accounts[newPw] = {password:newPw, label, tabs:{report:!!fv.tabs.report, entry:!!fv.tabs.entry, schedule:!!fv.tabs.schedule}};
  await saveAccountsConfig(accounts);
  state.accountFormOpen = false;
  state.accountEditKey = null;
  state.accountMgmtMessage = {type:'ok', text: 'Đã lưu tài khoản thành công.'};
  render();
}

async function handleDeleteAccount(key){
  if(key.startsWith('kp:')){
    const id = Number(key.slice(3));
    const defaultPw = "kp"+id;
    await loadAccountsConfig();
    if(isPasswordTaken(defaultPw, {khuId: id})){
      state.accountConfirmDeleteKey = null;
      state.accountMgmtMessage = {type:'err', text:`Không thể khôi phục vì mật mã mặc định "${defaultPw}" đang trùng với tài khoản khác.`};
      render();
      return;
    }
    const pwMap = await loadPasswordsMap();
    pwMap[id] = defaultPw;
    await storageSet(STORE_PREFIX+"passwords", JSON.stringify(pwMap), true);
    state.passwordsMap = pwMap;
    const kpTabs = await loadKpTabsConfig();
    kpTabs[id] = {report:false, entry:true, schedule:true};
    await saveKpTabsConfig(kpTabs);
    state.accountConfirmDeleteKey = null;
    state.accountMgmtMessage = {type:'ok', text:`Đã khôi phục Khu phố ${id} về mật mã và phân quyền mặc định.`};
    render();
    return;
  }
  const accounts = await loadAccountsConfig();
  delete accounts[key];
  await saveAccountsConfig(accounts);
  state.accountConfirmDeleteKey = null;
  state.accountMgmtMessage = {type:'ok', text:'Đã xóa tài khoản.'};
  render();
}

function isTeamActiveOnDate(team, date){
  if(!team) return false;
  if(team.startDate && date < team.startDate) return false;
  if(team.endDate && date > team.endDate) return false;
  return true;
}
function activeTeamIdsForDate(date){

async function loadSchedule(){
  let raw = await storageGet(SCHEDULE_KEY, true);
  if(raw){ try{ return JSON.parse(raw); }catch(e){ /* fallthrough */ } }
  return {regs:{}};
}
async function saveSchedule(data){
  await storageSet(SCHEDULE_KEY, JSON.stringify(data), true);
}

function getDayInfo(schedule, date){
  const teamShiftCount = {};
  const slots = {sang:{}, chieu:{}, toi:{}};
  Object.values(schedule.regs || {}).forEach(r=>{
    if(r.date === date){
      slots[r.shift][r.team] = r;
      teamShiftCount[r.team] = (teamShiftCount[r.team]||0) + 1;
    }
  });
  return {teamShiftCount, slots};
}

function findAvailableTeamForShift(dayInfo, shift, activeTeams){
  for(const t of activeTeams){
    if(!dayInfo.slots[shift][t] && (dayInfo.teamShiftCount[t]||0) < MAX_SHIFTS_PER_TEAM_PER_DAY) return t;
  }
  return null;
}

function shiftAvailableCount(dayInfo, shift, activeTeams){
  let count = 0;
  activeTeams.forEach(t=>{ if(!dayInfo.slots[shift][t] && (dayInfo.teamShiftCount[t]||0) < MAX_SHIFTS_PER_TEAM_PER_DAY) count++; });
  return count;
}

function shiftLabel(shiftKey){
  const s = SHIFTS.find(x=>x.key===shiftKey);
  return s ? `${s.label} (${s.time})` : shiftKey;
}

function addDays(dateStr, days){
  const d = new Date(dateStr+"T00:00:00");
  d.setDate(d.getDate()+days);
  return toDateStr(d);
}
function getMonday(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const day = d.getDay(); // 0=CN..6=T7
  const diff = day === 0 ? -6 : 1-day;
  return addDays(dateStr, diff);
}
const WEEKDAY_LABELS = {0:'Chủ nhật', 1:'Thứ 2', 2:'Thứ 3', 3:'Thứ 4', 4:'Thứ 5', 5:'Thứ 6', 6:'Thứ 7'};
function weekdayLabel(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  return WEEKDAY_LABELS[d.getDay()];
}
function getISOWeekNumber(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  d.setDate(d.getDate() + 3 - ((d.getDay()+6)%7)); // đưa về Thứ 5 của tuần đó (chuẩn ISO 8601)
  const week1 = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - week1) / 86400000 - 3 + ((week1.getDay()+6)%7)) / 7);
}

function renderWeekGridSection(){
  const weekStart = state.gridWeekStart || getMonday(state.scheduleDate || todayClamped());
  const days = [0,1,2,3,4,5,6].map(i=>addDays(weekStart,i));
  const schedule = state.scheduleData;

  function cellContent(team, date){
    if(!schedule) return '';
    const order = {sang:0, chieu:1, toi:2};
    const entries = Object.values(schedule.regs || {})
      .filter(r=>r.team===team && r.date===date)
      .sort((a,b)=>order[a.shift]-order[b.shift]);
    if(!entries.length) return '<span class="muted">—</span>';
    return entries.map(e=>{
      const s = SHIFTS.find(x=>x.key===e.shift);
      return `<div>${s.label}: <b>KP${e.khuId}</b></div>`;
    }).join('');
  }

  const headerCells = days.map((d)=>`<th style="text-align:center;">${weekdayLabel(d)}<br><span style="font-weight:400;">${formatDateDisplay(d)}</span></th>`).join('');
  const rowTeamIds = (()=>{
    const s = new Set(allTeamIds());
    if(schedule){
      Object.values(schedule.regs || {}).forEach(r=>{ if(days.includes(r.date)) s.add(r.team); });
    }
    return Array.from(s).sort((a,b)=>a-b);
  })();
  const bodyRows = rowTeamIds.map(t=>`
    <tr>
      <td class="name-cell">Đoàn ${t}</td>
      ${days.map(d=>`<td style="text-align:center;">${cellContent(t,d)}</td>`).join('')}
    </tr>`).join('');

  return `
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px;">
        <h3 style="margin:0;">🗂️ Lưới lịch khám theo tuần</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn-secondary" id="weekPrevBtn">◀ Tuần trước</button>
          <button class="btn-secondary" id="weekNextBtn">Tuần sau ▶</button>
          <button class="btn-primary" id="weekExportBtn">📤 Xuất Excel tuần này</button>
        </div>
      </div>
      <p class="muted" style="margin-bottom:12px;">Tuần ${getISOWeekNumber(weekStart)}/${new Date(weekStart+"T00:00:00").getFullYear()}: ${formatDateDisplay(days[0])} – ${formatDateDisplay(days[6])} <button class="edit-link" id="weekTodayBtn" style="margin-left:8px;">Về tuần này</button></p>

async function handleExportWeeklyExcel(){
  try{
    const weekStart = state.gridWeekStart || getMonday(state.scheduleDate || todayClamped());
    const days = [0,1,2,3,4,5,6].map(i=>addDays(weekStart,i));
    const schedule = state.scheduleData || await loadSchedule();
    const order = {sang:0, chieu:1, toi:2};

    const matrixRows = [["Đoàn", ...days.map((d)=>`${weekdayLabel(d)} ${formatDateDisplay(d)}`)]];
    const rowTeamIds = (()=>{
      const s = new Set(allTeamIds());
      Object.values(schedule.regs || {}).forEach(r=>{ if(days.includes(r.date)) s.add(r.team); });
      return Array.from(s).sort((a,b)=>a-b);
    })();
    rowTeamIds.forEach(t=>{
      const row = [`Đoàn ${t}`];
      days.forEach(d=>{
        const entries = Object.values(schedule.regs || {})
          .filter(r=>r.team===t && r.date===d)
          .sort((a,b)=>order[a.shift]-order[b.shift]);
        row.push(entries.map(e=>`${SHIFTS.find(s=>s.key===e.shift).label}: KP${e.khuId}`).join(" | "));
      });
      matrixRows.push(row);
    });

    const detailRows = [["Ngày","Thứ","Ca","Đoàn","Khu phố","Người đăng ký","SĐT"]];
    days.forEach((d)=>{
      const entries = Object.values(schedule.regs || {})
        .filter(r=>r.date===d)
        .sort((a,b)=> order[a.shift]-order[b.shift] || a.team-b.team);
      entries.forEach(e=>{
        detailRows.push([formatDateDisplay(d), weekdayLabel(d), SHIFTS.find(s=>s.key===e.shift).label, `Đoàn ${e.team}`, `Khu phố ${e.khuId}`, e.name, e.phone]);
      });
    });
    if(detailRows.length === 1) detailRows.push(["(Không có đăng ký nào trong tuần này)","","","","","",""]);

    const wb = XLSX.utils.book_new();
    const ws1 = XLSX.utils.aoa_to_sheet(matrixRows);
    ws1['!cols'] = [{wch:10}, ...days.map(()=>({wch:24}))];
    XLSX.utils.book_append_sheet(wb, ws1, "Lưới tuần");

    const ws2 = XLSX.utils.aoa_to_sheet(detailRows);
    ws2['!cols'] = [{wch:12},{wch:10},{wch:16},{wch:10},{wch:12},{wch:20},{wch:14}];
    XLSX.utils.book_append_sheet(wb, ws2, "Chi tiết tuần");

    const stamp = weekStart.replace(/-/g,'') + "-" + days[6].replace(/-/g,'');
    XLSX.writeFile(wb, `lich-kham-tuan-${stamp}.xlsx`);
    state.scheduleMessage = {type:'ok', text:'Đã xuất file Excel lịch khám theo tuần.'};
  }catch(e){
    console.error('handleExportWeeklyExcel failed:', e);
    state.scheduleMessage = {type:'err', text:'Xuất file thất bại do sự cố lưu trữ. Vui lòng thử lại.'};
  }
  render();
}

    <div class="card">
      <h3>🚌 Quản lý đoàn khám</h3>
      <p class="muted" style="margin-bottom:12px;">Thêm đoàn mới (ví dụ Đoàn 4 hỗ trợ tạm thời) với ngày bắt đầu/kết thúc hoạt động, hoặc xóa đoàn không còn hoạt động. Lịch khám cũ của đoàn đã xóa vẫn được giữ nguyên trong báo cáo và lưới tuần.</p>
      ${state.teamMgmtMessage ? `<div class="banner ${state.teamMgmtMessage.type}">${escapeHtml(state.teamMgmtMessage.text)}</div>` : ''}
      <div class="table-scroll">
        <table>
          <thead><tr><th class="name-cell">Đoàn</th><th style="text-align:left;">Bắt đầu</th><th style="text-align:left;">Kết thúc</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${formBlock}
    </div>
  `;
}

function bindTeamManagementSection(){
  const openAddBtn = document.getElementById('teamOpenAddBtn');
  if(openAddBtn) openAddBtn.addEventListener('click', ()=>{
    state.teamFormOpen = true;
    state.teamEditId = null;
    state.teamForm = {startDate: todayClamped(), endDate: ""};
    state.teamMgmtMessage = null;
    render();
  });

  const cancelFormBtn = document.getElementById('teamCancelFormBtn');
  if(cancelFormBtn) cancelFormBtn.addEventListener('click', ()=>{
    state.teamFormOpen = false;
    state.teamEditId = null;
    render();
  });

  const startInput = document.getElementById('teamStartDateInput');
  if(startInput) startInput.addEventListener('change', ()=>{ state.teamForm.startDate = startInput.value; });
  const endInput = document.getElementById('teamEndDateInput');
  if(endInput) endInput.addEventListener('change', ()=>{ state.teamForm.endDate = endInput.value; });

  const saveBtn = document.getElementById('teamSaveBtn');
  if(saveBtn) saveBtn.addEventListener('click', handleSaveTeam);

  document.querySelectorAll('[data-team-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.teamEdit;
      const t = state.teamsConfig[id];
      state.teamEditId = id;
      state.teamFormOpen = true;
      state.teamForm = {startDate: t.startDate || "", endDate: t.endDate || ""};
      state.teamMgmtMessage = null;
      render();
    });
  });
  document.querySelectorAll('[data-team-delete]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.teamConfirmDeleteId = btn.dataset.teamDelete;
      render();
    });
  });
  document.querySelectorAll('[data-team-cancel-delete]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.teamConfirmDeleteId = null;
      render();
    });
  });
  document.querySelectorAll('[data-team-confirm-delete]').forEach(btn=>{
    btn.addEventListener('click', ()=> handleDeleteTeam(btn.dataset.teamConfirmDelete));
  });
}

async function handleSaveTeam(){
  const form = state.teamForm;
  if(!form.startDate){
    state.teamMgmtMessage = {type:'err', text:'Vui lòng chọn ngày bắt đầu.'};
    render();
    return;
  }
  if(form.endDate && form.endDate < form.startDate){
    state.teamMgmtMessage = {type:'err', text:'Ngày kết thúc phải sau ngày bắt đầu.'};
    render();
    return;
  }
  try{
    const cfg = await loadTeamsConfig();
    if(state.teamEditId){
      cfg[state.teamEditId] = {id: Number(state.teamEditId), startDate: form.startDate, endDate: form.endDate || null};
    } else {
      const ids = Object.keys(cfg).map(Number);
      const newId = ids.length ? Math.max(...ids) + 1 : 1;
      cfg[newId] = {id: newId, startDate: form.startDate, endDate: form.endDate || null};
    }
    await saveTeamsConfig(cfg);
    state.teamFormOpen = false;
    state.teamMgmtMessage = {type:'ok', text: state.teamEditId ? 'Đã cập nhật đoàn khám.' : 'Đã thêm đoàn khám mới.'};
    state.teamEditId = null;
  }catch(e){
    console.error('handleSaveTeam failed:', e);
    state.teamMgmtMessage = {type:'err', text:'Không lưu được do sự cố lưu trữ. Vui lòng thử lại.'};
  }
  render();
}

async function handleDeleteTeam(id){
  try{
    const cfg = await loadTeamsConfig();
    delete cfg[id];
    await saveTeamsConfig(cfg);
    state.teamConfirmDeleteId = null;
    state.teamMgmtMessage = {type:'ok', text:`Đã xóa Đoàn ${id} khỏi danh sách hoạt động. Lịch khám cũ của đoàn này (nếu có) vẫn được giữ nguyên.`};
  }catch(e){
    console.error('handleDeleteTeam failed:', e);
    state.teamMgmtMessage = {type:'err', text:'Không xóa được do sự cố lưu trữ. Vui lòng thử lại.'};
  }
  render();
}

function renderScheduleLockSection(){
  const locked = !!state.scheduleLockedForKp;
  return `
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
        <div>
          <h3 style="margin:0 0 4px;">${locked ? '🔒' : '🔓'} Đăng ký lịch khám của khu phố</h3>
          <p class="muted" style="margin:0;">${locked
            ? 'Đang KHOÁ — mật mã khu phố không thấy tab "Đăng ký lịch khám" (chỉ áp dụng cho mật mã khu phố, không ảnh hưởng admin/mật mã khác).'
            : 'Đang MỞ — khu phố có thể tự vào tab "Đăng ký lịch khám" để đăng ký/hủy lịch.'}</p>
        </div>
        <button class="btn-primary" id="scheduleLockToggleBtn">${locked ? '🔓 Mở lại cho khu phố' : '🔒 Khoá lại với khu phố'}</button>
      </div>
    </div>
  `;
}
function bindScheduleLockSection(){
  const btn = document.getElementById('scheduleLockToggleBtn');
  if(btn) btn.addEventListener('click', async ()=>{
    await setScheduleLockState(!state.scheduleLockedForKp);
    render();
  });
}

function resetScheduleForm(){
  state.scheduleForm = {shift:"", name:"", phone:"", khuId:"", team:""};
  state.scheduleFormErrors = {};
  state.scheduleEditId = null;
}

function bindScheduleTab(){
  const khuSelect = document.getElementById('scheduleKhuSelect');
  if(khuSelect) khuSelect.addEventListener('change', ()=>{ state.scheduleForm.khuId = khuSelect.value; });

  const dateInput = document.getElementById('scheduleDateInput');
  if(dateInput){
    dateInput.addEventListener('change', async ()=>{
      state.scheduleDate = dateInput.value;
      state.scheduleMessage = null;
      state.gridWeekStart = getMonday(state.scheduleDate);
      await loadScheduleForDate(state.scheduleDate);
    });
  }

  const shiftSelect = document.getElementById('scheduleShiftSelect');
  if(shiftSelect) shiftSelect.addEventListener('change', ()=>{ state.scheduleForm.shift = shiftSelect.value; });

  const teamSelect = document.getElementById('scheduleTeamSelect');
  if(teamSelect) teamSelect.addEventListener('change', ()=>{ state.scheduleForm.team = teamSelect.value; });

  const nameInput = document.getElementById('scheduleNameInput');
  if(nameInput) nameInput.addEventListener('input', ()=>{ state.scheduleForm.name = nameInput.value; });

  const phoneInput = document.getElementById('schedulePhoneInput');
  if(phoneInput) phoneInput.addEventListener('input', ()=>{ state.scheduleForm.phone = phoneInput.value; });

  const submitBtn = document.getElementById('scheduleSubmitBtn');
  if(submitBtn) submitBtn.addEventListener('click', handleScheduleSubmit);

  const cancelEditBtn = document.getElementById('scheduleCancelEditBtn');
  if(cancelEditBtn) cancelEditBtn.addEventListener('click', ()=>{ resetScheduleForm(); render(); });

  document.querySelectorAll('[data-schedule-delete]').forEach(btn=>{
    btn.addEventListener('click', ()=> handleScheduleDelete(btn.dataset.scheduleDelete));
  });
  document.querySelectorAll('[data-schedule-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=> handleScheduleEditLoad(btn.dataset.scheduleEdit));
  });

  if(isFullControl()){
    bindTeamManagementSection();
    bindWeekGridSection();
  }
  if(state.role === 'admin') bindScheduleLockSection();
}

function handleScheduleEditLoad(id){
  const reg = state.scheduleData && state.scheduleData.regs[id];
  if(!reg) return;
  state.scheduleDate = reg.date;
  state.scheduleForm = {shift: reg.shift, name: reg.name, phone: reg.phone, khuId: String(reg.khuId), team: String(reg.team)};
  state.scheduleFormErrors = {};
  state.scheduleEditId = id;
  state.scheduleMessage = null;
  loadScheduleForDate(reg.date);
  window.scrollTo({top:0, behavior:'smooth'});
}

async function handleScheduleSubmit(){
  const isKp = state.role && state.role.type === 'kp';
  const fv = state.scheduleForm;
  const date = state.scheduleDate;
  const errors = {};
  const khuId = isKp ? state.role.id : (fv.khuId ? Number(fv.khuId) : null);

  if(!isKp && !khuId) errors.khuId = "Vui lòng chọn khu phố.";
  if(!fv.shift) errors.shift = "Vui lòng chọn ca khám.";
  if(!fv.name || !fv.name.trim()) errors.name = "Chưa nhập";
  else if(fv.name.trim().length < 3) errors.name = "Tên phải có ít nhất 3 ký tự";
  if(!fv.phone || !fv.phone.trim()) errors.phone = "Chưa nhập";
  else if(!/^0[0-9]{9}$/.test(fv.phone.trim())) errors.phone = "Số điện thoại phải đủ 10 chữ số (bắt đầu bằng 0)";

  if(Object.keys(errors).length){
    state.scheduleFormErrors = errors;
    render();
    return;
  }
  state.scheduleFormErrors = {};

  try{
    const schedule = await loadSchedule();
    if(state.scheduleEditId){
      delete schedule.regs[state.scheduleEditId];
    }
    const duplicateForKhu = Object.values(schedule.regs || {}).find(r=> r.khuId === khuId && r.date === date && r.shift === fv.shift);
    if(duplicateForKhu){
      state.scheduleMessage = {type:'err', text:`Khu phố ${khuId} đã có Đoàn ${duplicateForKhu.team} khám vào ${shiftLabel(fv.shift)} ngày ${formatDateDisplay(date)} rồi. Mỗi khu phố chỉ được 1 đoàn khám trong 1 ca.`};
      render();
      return;
    }
    const dayInfo = getDayInfo(schedule, date);
    const manualTeam = ((isFullControl()) && fv.team) ? Number(fv.team) : null;
    let team, exceedsCap = false;
    if(manualTeam){
      if(dayInfo.slots[fv.shift][manualTeam]){
        state.scheduleMessage = {type:'err', text:`Đoàn ${manualTeam} đã có lịch khám khác vào ${shiftLabel(fv.shift)} ngày ${formatDateDisplay(date)}. Vui lòng chọn đoàn khác hoặc sửa/xóa lịch cũ trước.`};
        render();
        return;
      }
      team = manualTeam;
      exceedsCap = (dayInfo.teamShiftCount[manualTeam]||0) >= MAX_SHIFTS_PER_TEAM_PER_DAY;
    } else {
      team = findAvailableTeamForShift(dayInfo, fv.shift, activeTeamIdsForDate(date));
      if(!team){
        state.scheduleMessage = {type:'err', text:'Ca này vừa hết chỗ (đủ số đoàn đang hoạt động hoặc các đoàn đã đủ 2 ca trong ngày). Vui lòng chọn ca hoặc ngày khác, hoặc chỉ định đoàn thủ công.'};
        render();
        return;
      }
    }
    const regId = `${date}_${fv.shift}_${team}`;
    const existing = (state.scheduleData && state.scheduleData.regs[state.scheduleEditId]) || null;
    schedule.regs[regId] = {
      id: regId, date, shift: fv.shift, team, khuId,
      name: fv.name.trim(), phone: fv.phone.trim(),
      createdAt: existing ? existing.createdAt : Date.now(),
      updatedAt: state.scheduleEditId ? Date.now() : undefined
    };
    await saveSchedule(schedule);
    state.scheduleData = schedule;
    const baseMsg = state.scheduleEditId
      ? `Đã cập nhật đăng ký — Đoàn ${team} sẽ khám Khu phố ${khuId} vào ${shiftLabel(fv.shift)} ngày ${formatDateDisplay(date)}.`
      : `Đã đăng ký thành công — Đoàn ${team} sẽ khám Khu phố ${khuId} vào ${shiftLabel(fv.shift)} ngày ${formatDateDisplay(date)}.`;
    state.scheduleMessage = {type: exceedsCap ? 'warn' : 'ok', text: exceedsCap ? baseMsg + ` Lưu ý: Đoàn ${team} đã vượt quá ${MAX_SHIFTS_PER_TEAM_PER_DAY} ca trong ngày này.` : baseMsg};
    resetScheduleForm();
  }catch(e){
    console.error('handleScheduleSubmit failed:', e);
    state.scheduleMessage = {type:'err', text:'Không lưu được do sự cố lưu trữ. Vui lòng thử lại.'};
  }
  render();
}

async function handleScheduleDelete(id){
  const isKp = state.role && state.role.type === 'kp';
  const reg = state.scheduleData && state.scheduleData.regs[id];
  if(!reg) return;
  if(isKp && reg.khuId !== state.role.id) return; // an toàn: kp chỉ hủy đăng ký của chính mình
  try{
    const schedule = await loadSchedule();
    delete schedule.regs[id];
    await saveSchedule(schedule);
    state.scheduleData = schedule;
    state.scheduleMessage = {type:'ok', text: isKp ? 'Đã hủy đăng ký lịch khám.' : 'Đã xóa đăng ký lịch khám.'};
    if(state.scheduleEditId === id) resetScheduleForm();
  }catch(e){
    console.error('handleScheduleDelete failed:', e);
    state.scheduleMessage = {type:'err', text:'Không xóa được do sự cố lưu trữ. Vui lòng thử lại.'};
  }
  render();
}

window.addEventListener('unhandledrejection', function(ev){
  console.error('Unhandled rejection:', ev.reason);
  ev.preventDefault();
  showGlobalStorageError();
});
window.addEventListener('error', function(ev){
  console.error('Uncaught error:', ev.error || ev.message);
  ev.preventDefault();
  showGlobalStorageError();
});
function showGlobalStorageError(){
  const msg = {type:'err', text:'Hệ thống lưu trữ đám mây đang gặp sự cố tạm thời. Vui lòng đợi một chút rồi thử lại (dữ liệu bạn vừa nhập có thể chưa được lưu).'};
  if(state.tab === 'entry'){ state.saveMessage = msg; state.bulkLoading = false; state.bulkMessage = msg; }
  if(state.tab === 'report'){ state.reportLoading = false; }
  if(state.tab === 'schedule'){ state.scheduleLoading = false; state.scheduleMessage = msg; }
  try{ render(); }catch(e){ /* noop */ }
}
/* ================= TỰ ĐỘNG ĐĂNG XUẤT SAU 15 PHÚT KHÔNG HOẠT ĐỘNG ================= */
const INACTIVITY_LIMIT_MS = 15 * 60 * 1000;
let inactivityTimer = null;
function resetInactivityTimer(){
  if(!state.role) return;
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(()=>{
    if(state.role){
      logout();
      state.loginError = "Đã tự động đăng xuất do không hoạt động trong 15 phút.";
      render();
    }
  }, INACTIVITY_LIMIT_MS);
}
['click','keydown','mousemove','touchstart','scroll'].forEach(evt=>{
  document.addEventListener(evt, ()=>{ if(state.role) resetInactivityTimer(); }, {passive:true});
});

/* ================= INIT ================= */
render();
</script>
